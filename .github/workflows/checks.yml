name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DATABASE_ENGINE: sqlite
      DJANGO_SECRET_KEY: ci-only-key-not-for-deployment-long-enough-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test accounts campus video_analysis
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
